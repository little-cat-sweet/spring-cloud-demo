server:
  port: 9000


spring:
  application:
    name: gateway-service


  cloud:

    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
        username: nacos
        password: nacos


    gateway:

      routes:

        - id: user-service-route
          uri: lb://user-service
          predicates:
            - Path=/user/**


        - id: order-service-route
          uri: lb://order-service
          predicates:
            - Path=/order/**



logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    org.springframework.cloud.loadbalancer: DEBUG