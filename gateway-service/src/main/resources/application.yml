server:
  port: 9000

management:
  tracing:
    sampling:
      probability: 1.0


spring:
  application:
    name: gateway-service


  cloud:

    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
        username: nacos
        password: nacos


    gateway:

      routes:

        - id: trace-demo-order-route
          uri: lb://order-service
          predicates:
            - Path=/trace-demo/order/{id}
          filters:
            - RewritePath=/trace-demo/order/(?<id>[^/]+),/order/${id}

        - id: user-service-route
          uri: lb://user-service
          predicates:
            - Path=/user/**


        - id: order-service-route
          uri: lb://order-service
          predicates:
            - Path=/order/**



logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]"
  level:
    org.springframework.cloud.gateway: DEBUG
    org.springframework.cloud.loadbalancer: DEBUG
