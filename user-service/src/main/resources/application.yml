server:
  port: 8081

management:
  tracing:
    sampling:
      probability: 1.0

spring:
  application:
    name: user-service
  cloud:
    nacos:
      config:
        server-addr: localhost:8848
        username: nacos
        password: nacos
      discovery:
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:nacos}
    sentinel:
      transport:
        dashboard: localhost:8858
        port: 8719

  config:
    import:
      - optional:nacos:user-service.yaml

logging:
  pattern:
    # traceId 由 micrometer-tracing 自动写入 MDC，代码里只写 log.info(...) 即可
    console: "%d{HH:mm:ss.SSS} traceId=[%X{traceId:-}] %5p [${spring.application.name:}] %logger{36} : %msg%n%wEx"


