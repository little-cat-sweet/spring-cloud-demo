brokerClusterName = DefaultCluster
brokerName = broker-a
brokerId = 0

# 容器内部通过服务名访问 namesrv
namesrvAddr = rmqnamesrv:9876

# 关键配置：告诉客户端该用哪个地址连 broker。
# 宿主机上的 Java 应用和 dashboard 容器都要能访问，所以填宿主机的局域网 IP。
# 换网络 / 重连 WiFi 后宿主机 IP 会变，改这里然后重启 broker 容器即可。
brokerIP1 = 192.168.141.58
listenPort = 10911

autoCreateTopicEnable = true
autoCreateSubscriptionGroup = true

brokerRole = ASYNC_MASTER
flushDiskType = ASYNC_FLUSH
deleteWhen = 04
fileReservedTime = 48
